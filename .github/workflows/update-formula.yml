name: Update Formula

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name"
        required: true
        type: string
      version:
        description: "Release version"
        required: true
        type: string
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve formula and release
        id: release
        env:
          FORMULA: ${{ github.event_name == 'workflow_dispatch' && inputs.formula || github.event.client_payload.formula }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
        run: ruby .github/scripts/update-formula.rb resolve >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ steps.release.outputs.formula }}
          REPOSITORY: ${{ steps.release.outputs.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p assets
          gh release download "v${VERSION}" --repo "$REPOSITORY" \
            --pattern "${FORMULA}-*.tar.gz" --dir assets

      - name: Update formula
        env:
          FORMULA: ${{ steps.release.outputs.formula }}
          REPOSITORY: ${{ steps.release.outputs.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: ruby .github/scripts/update-formula.rb render

      - name: Validate formula
        env:
          FORMULA: ${{ steps.release.outputs.formula }}
        run: ruby -c "Formula/${FORMULA}.rb"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          add-paths: Formula/${{ steps.release.outputs.formula }}.rb
          commit-message: "✨ feat(${{ steps.release.outputs.formula }}): update to v${{ steps.release.outputs.version }}"
          title: "${{ steps.release.outputs.formula }}: update to v${{ steps.release.outputs.version }}"
          body: |+
            Updates ${{ steps.release.outputs.formula }} formula to version ${{ steps.release.outputs.version }}.
          branch: update-${{ steps.release.outputs.formula }}-${{ steps.release.outputs.version }}
          delete-branch: true
