name: Update README

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/scripts/update-readme.rb"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate README formula section
        run: ruby .github/scripts/update-readme.rb

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git -c commit.gpgsign=false commit -m "📃 docs(readme): update formula list"
          git push origin HEAD:main
