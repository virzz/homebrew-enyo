name: Auto Approve and Merge Formula PR

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and squash merge formula PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.pull_requests[0].head.repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
        run: |
          test -n "$PR_NUMBER"
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          case "$HEAD_REF" in
            update-*) ;;
            *) exit 0 ;;
          esac

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq .state)
          test "$STATE" = OPEN

          gh pr review "$PR_NUMBER" --repo "$REPOSITORY" \
            --approve --body "Automated approval: brew test-bot passed."
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" \
            --squash --delete-branch
