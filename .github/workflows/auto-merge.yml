name: Auto Approve and Merge Formula PR

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and squash merge formula PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$HEAD_REF" in
            update-*) ;;
            *) exit 0 ;;
          esac

          PR_NUMBER=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_REF" \
            --state open --json number,headRepository,headRefOid \
            --jq '.[] | select(.headRepository.nameWithOwner == env.REPOSITORY) | select(.headRefOid == env.RUN_HEAD_SHA) | .number')
          test -n "$PR_NUMBER"

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq .state)
          test "$STATE" = OPEN

          gh pr review "$PR_NUMBER" --repo "$REPOSITORY" \
            --approve --body "Automated approval: brew test-bot passed."
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" \
            --squash --delete-branch
