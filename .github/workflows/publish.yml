name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

jobs:
  pr-pull:
    if: github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Set up git
        uses: Homebrew/actions/git-user-config@master

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --no-upload --tap="${{ github.repository }}" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@master
        with:
          token: ${{ github.token }}
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"

  auto-merge:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve and squash merge formula PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$HEAD_REF" in
            update-*) ;;
            *) exit 0 ;;
          esac

          PR_NUMBER=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_REF" \
            --state open --json number,headRepository,headRefOid \
            --jq '.[] | select(.headRepository.nameWithOwner == env.REPOSITORY) | select(.headRefOid == env.RUN_HEAD_SHA) | .number')
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq .state)
          test "$STATE" = OPEN

          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json author --jq '.author.login')
          if [ "$AUTHOR" != 'app/github-actions' ] && [ "$AUTHOR" != 'github-actions[bot]' ]; then
            gh pr review "$PR_NUMBER" --repo "$REPOSITORY" \
              --approve --body "Automated approval: brew test-bot passed."
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" \
            --squash --delete-branch
